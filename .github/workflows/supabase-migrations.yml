name: Supabase migrations

# Applies app/supabase/migrations to the linked Supabase project when they change on main.
# Required repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID.
# Run it once manually with "baseline" ticked if the first migration was applied by hand.

on:
  push:
    branches: [main]
    paths:
      - "app/supabase/migrations/**"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Mark 20261101000000 as already applied (first migration was run by hand)"
        type: boolean
        default: false

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Baseline first migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline }}
        run: supabase migration repair --status applied 20261101000000

      - run: supabase db push
